services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bonair
      POSTGRES_PASSWORD: bonair_dev_password
      POSTGRES_DB: bonair_campaigns
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonair -d bonair_campaigns"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=bonair_campaigns;Username=bonair;Password=bonair_dev_password
      ConnectionStrings__Redis: redis:6379
      Supabase__JwtSecret: ${SUPABASE_JWT_SECRET:-your-supabase-jwt-secret-min-32-chars-long}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__PriceStarter: ${STRIPE_PRICE_STARTER:-price_starter}
      Stripe__PriceGrowth: ${STRIPE_PRICE_GROWTH:-price_growth}
      Stripe__PriceAgency: ${STRIPE_PRICE_AGENCY:-price_agency}
      Cors__Origins: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      - api

volumes:
  postgres_data:
